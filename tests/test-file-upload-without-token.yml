name: Test file upload without token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SLACK_WEBHOOK: "http://127.0.0.1:1/never-called"
          SLACK_MESSAGE: "upload test"
          SLACK_FILE_UPLOAD: "README.md"
      - name: Assert action failed due to missing SLACK_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when SLACK_FILE_UPLOAD is set without SLACK_TOKEN"
            exit 1
          fi
          echo "PASS"
