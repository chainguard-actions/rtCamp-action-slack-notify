name: Test missing webhook fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ""
          SLACK_MESSAGE: "This should not be sent"
      - name: Assert action failed due to missing secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when SLACK_WEBHOOK is missing"
            exit 1
          fi
          echo "PASS"
